<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librería Utilería JS - Inicio de Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">UtileriaJS</a>
    <div class="nav-links">
      <a href="index.html">Registro & Modal</a>
      <a href="login.html" class="active">Login</a>
    </div>
  </nav>

  <!-- Formulario de Acceso -->
  <main class="container">
    <div class="card" style="max-width: 460px; margin: 3rem auto;">
      <h1 class="card-title" style="text-align: center;">Iniciar Sesión</h1>
      <p class="card-subtitle" style="text-align: center;">Acceso protegido validando credenciales.</p>

      <form id="formularioLogin" novalidate>
        
        <!-- Correo Electrónico: validarCorreo -->
        <div class="form-group">
          <label for="loginCorreo">Correo Electrónico:</label>
          <input type="email" id="loginCorreo" placeholder="tu.correo@dominio.com">
          <span class="error-msg" id="err-loginCorreo"></span>
        </div>

        <!-- Contraseña: validarPassword -->
        <div class="form-group">
          <label for="loginPassword">Contraseña:</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
          <span class="error-msg" id="err-loginPassword"></span>
        </div>

        <button type="submit" class="btn" id="boton">Ingresar al Sistema</button>
        
      </form>
    </div>
  </main>

  <!-- Modal de confirmación Login -->
  <div class="modal-overlay" id="modalLogin">
    <div class="modal-content">
      <div class="modal-badge"><img src="img/image.png" alt="imagen1" width="100"></div>
      <h2 class="modal-title">Acceso Concedido</h2>
      <p class="modal-text" id="modalLoginTexto">Formato de correo y robustez de clave validados con <code>utileria.js</code>.</p>
      <button class="btn" id="cerrarModalLogin">Entendido</button>
    </div>
  </div>

  <footer>
    <p>Proyecto Utilería JS &bull; Práctica de Modularización y Validación</p>
  </footer>

  <!-- Carga de la librería y script de validación -->
  <script src="js/utileria.js"></script>
  <script>
    const formLogin = document.getElementById('formularioLogin');
    const modalLogin = document.getElementById('modalLogin');
    const cerrarModalLogin = document.getElementById('cerrarModalLogin');

    formLogin.addEventListener('submit', function(e) {
      e.preventDefault();
      let valido = true;

      const correo = document.getElementById('loginCorreo');
      const errCorreo = document.getElementById('err-loginCorreo');
      const pass = document.getElementById('loginPassword');
      const errPass = document.getElementById('err-loginPassword');

      // Validación con validarCorreo
      if (!validarCorreo(correo.value)) {
        errCorreo.textContent = 'Ingresa un formato de correo válido.';
        correo.classList.add('is-invalid');
        valido = false;
      } else {
        errCorreo.textContent = '';
        correo.classList.remove('is-invalid');
        correo.classList.add('is-valid');
      }

      // Validación con validarPassword
      if (!validarPassword(pass.value)) {
        errPass.textContent = 'La contraseña no cumple los requisitos (mín. 8 chars, mayúscula, número y símbolo).';
        pass.classList.add('is-invalid');
        valido = false;
      } else {
        errPass.textContent = '';
        pass.classList.remove('is-invalid');
        pass.classList.add('is-valid');
      }

      if (valido) {
        document.getElementById('modalLoginTexto').innerHTML = `
          Bienvenido(a) <strong>${correo.value}</strong>.<br>
          Tus credenciales cumplen todas las políticas de formato y seguridad.
        `;
        modalLogin.classList.add('active');
      }
    });

    cerrarModalLogin.addEventListener('click', () => {
      modalLogin.classList.remove('active');
      formLogin.reset();
      document.querySelectorAll('input').forEach(i => i.classList.remove('is-valid'));
    });
  </script>
</body>
</html>
