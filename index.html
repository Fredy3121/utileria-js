<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Librería Utilería JS - Formulario y Modal</title>
  <link rel="stylesheet" href="css/styles.css">
    <script src="js/utileria.js"></script>
  <script src="js/actividad2.js"></script>
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">UtileriaJS</a>
    <div class="nav-links">
      <a href="index.html" class="active">Registro & Modal</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <!-- Contenedor del Formulario -->
  <main class="container">
    <div class="card">
      <h1 class="card-title">Registro de Usuario</h1>

      <form id="formularioRegistro" novalidate>
        
        <!-- Nombre: soloLetras -->
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" placeholder="Ej. Alma Marcela Morales">
          <span class="error-msg" id="err-nombre"></span>
        </div>

        <!-- Matrícula / Código numérico: validarLongitud -->
        <div class="form-group">
          <label for="matricula">Matrícula o Folio (Máx. 6 dígitos numéricos):</label>
          <input type="text" id="matricula" placeholder="Ej. 123456" maxlength="6">
          <span class="error-msg" id="err-matricula"></span>
        </div>

        <!-- Correo Electrónico: validarCorreo -->
        <div class="form-group">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" placeholder="usuario@dominio.com">
          <span class="error-msg" id="err-correo"></span>
        </div>

        <!-- Fecha de Nacimiento: calcularEdad y esMayorDeEdad -->
        <div class="form-group">
          <label for="fechaNacimiento">Fecha de Nacimiento:</label>
          <input type="date" id="fechaNacimiento">
          <span class="error-msg" id="err-fechaNacimiento"></span>
        </div>

        <!-- Teléfono (Función libre: validarTelefonoMX) -->
        <div class="form-group">
          <label for="telefono">Teléfono de Contacto (10 dígitos):</label>
          <input type="text" id="telefono" placeholder="Ej. 5512345678" maxlength="10">
          <span class="error-msg" id="err-telefono"></span>
        </div>

        <!-- Salario pretendido (Función libre: formatearMoneda) -->
        <div class="form-group">
          <label for="salario">Ingreso Mensual ($):</label>
          <input type="number" id="salario" placeholder="Ej. 15000">
          <span class="error-msg" id="err-salario"></span>
        </div>

        <!-- Contraseña: validarPassword -->
        <div class="form-group">
          <label for="password">Contraseña (Mín. 8 caracteres, mayúscula, minúscula, número y especial):</label>
          <input type="password" id="password" placeholder="••••••••">
          <span class="error-msg" id="err-password"></span>
        </div>

        <button onclick="fun()" type="submit" class="btn">Registrar y Validar</button>
      </form>
    </div>
  </main>

  <!-- Ventana Modal de Confirmación y Edad Calculada -->
  <div class="modal-overlay" id="modalResultado">
    <div class="modal-content">
      <div class="modal-badge" id="modalBadge"><img src="img/image.png" alt="imagen1" width="100"></div>
      <h2 class="modal-title" id="modalTitulo">Registro Exitoso</h2>
      <p class="modal-text" id="modalMensaje"></p>
      <button class="btn" id="modalCerrar">Aceptar</button>
    </div>
  </div>

</body>
</html>
